[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 10000
via_ir = false
# no CBOR metadata: the CREATE2 addresses of the rollup contracts then depend
# only on the code, not on comments or source paths
bytecode_hash = "none"
cbor_metadata = false
# tests read proof fixtures written by `zkrollup fixture` (Rust prover)
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[lint]
# the verifier only calls the modexp precompile and its own periodic-column contract
exclude_lints = ["require-revert-in-loop", "reentrancy-events", "return-bomb"]

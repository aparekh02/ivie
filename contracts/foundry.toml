[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 10000
via_ir = false
# no CBOR metadata: the CREATE2 address of the registry then depends only on
# the code, not on comments or source paths
bytecode_hash = "none"
cbor_metadata = false
# tests read fixtures produced by tools/ (circuits + simulated vectors)
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[fuzz]
runs = 512

[profile.deep.fuzz]
runs = 20000

[lint]
# precompile / SSTORE2 calls only: no reentrancy surface, fixed-size returns
exclude_lints = ["require-revert-in-loop", "reentrancy-events", "return-bomb"]

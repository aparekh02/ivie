[workspace]
resolver = "3"
members = ["crates/zknet-core", "crates/zknetd", "crates/zknet-sdk", "crates/prover", "crates/rollup", "crates/quantum"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
zknet-core = { path = "crates/zknet-core" }
zknet-sdk = { path = "crates/zknet-sdk" }
alloy-primitives = { version = "1", features = ["serde"] }
ark-ff = "0.6"
ark-poly = "0.6"
alloy-sol-types = "1"
rayon = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.dev.package."*"]
opt-level = 3 # field arithmetic and FFTs are unusable at opt-level 0

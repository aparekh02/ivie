[workspace]
resolver = "3"
members = ["crates/zknet-core", "crates/zknetd", "crates/zknet-sdk"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
zknet-core = { path = "crates/zknet-core" }
zknet-sdk = { path = "crates/zknet-sdk" }
alloy-primitives = { version = "1", features = ["serde"] }
ark-bn254 = "0.6"
ark-bls12-381 = "0.6"
ark-ec = "0.6"
ark-ff = "0.6"

num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.dev.package."*"]
opt-level = 3 # pairings are unusable at opt-level 0
